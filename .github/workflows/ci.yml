name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull request runs are cancelled: cancelling a main run part way
  # through publishing could leave a pushed image unsigned.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  IMAGE_NAME: ghcr.io/thalovant/hivemind-telegram-bridge

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # --pre: the floors name alphas (hivemind-bus-client>=1.0.13a1).
        run: |
          python -m pip install --upgrade pip
          pip install --pre -e ".[test]" ruff
      - name: Lint (undefined names, unused imports, syntax errors)
        run: ruff check --isolated --select F,E9 .
      - name: Run tests
        run: python -m pytest tests -q

  smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --pull -t "${IMAGE_NAME}:ci-smoke-${GITHUB_SHA}" .
      - name: The image starts the bridge as an unprivileged user
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:ci-smoke-${GITHUB_SHA}"
          # The entrypoint is the bridge itself: --help answers and exits 0.
          docker run --rm "$image" --help | grep -q -- "--health-port"
          uid="$(docker run --rm --entrypoint id "$image" -u)"
          test "$uid" != "0" || { echo "the image runs as root"; exit 1; }
          # With no token anywhere the bridge refuses to start, naming the variable.
          if docker run --rm "$image" > out.txt 2>&1; then
            echo "started without a token"; exit 1
          fi
          grep -q "TELEGRAM_BOT_TOKEN" out.txt

  image:
    runs-on: ubuntu-latest
    needs: [test, smoke]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades this short-lived OIDC token for a
      # Fulcio certificate, so nothing here holds a key that could leak.
      id-token: write
    env:
      # Publish from main only. A pull request, or a manual run on another
      # branch, builds the image and stops there.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, and push under the commit's tag only
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: ${{ env.PUBLISH == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          # :latest is added only after the digest is signed and verified, so
          # it never points at an unsigned image.
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke-test the pushed digest, before it is signed
        # The smoke job tested its own build; this checks the very image that
        # gets signed. It runs before signing and before :latest moves, so a
        # failure leaves only an unsigned :sha- tag, which admission refuses.
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${DIGEST}"
          docker pull -q "$image" > /dev/null
          docker run --rm "$image" --help | grep -q -- "--health-port"
          uid="$(docker run --rm --entrypoint id "$image" -u)"
          test "$uid" != "0" || { echo "the image runs as root"; exit 1; }
          if docker run --rm "$image" > out.txt 2>&1; then
            echo "started without a token"; exit 1
          fi
          grep -q "TELEGRAM_BOT_TOKEN" out.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'
      - name: Sign the pushed digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      - name: Verify the signature, as an admission controller would
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE_NAME}@${DIGEST}" > /dev/null
      - name: Move :latest to the verified digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}@${DIGEST}"
          echo "published and verified: ${IMAGE_NAME}@${DIGEST} (:sha-${GITHUB_SHA}, :latest)"
